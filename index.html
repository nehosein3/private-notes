<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Notes</title>

  <!-- Latest CSS version -->
  <link rel="stylesheet" href="style.css?v=3">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body>

  <main class="app">

    <!-- =========================
         Main Header
         ========================= -->

    <header class="topbar">

      <div>

        <h1>Notes</h1>

        <p id="countLabel">0 Notes</p>

      </div>


      <button
        id="newBtn"
        class="icon-btn"
        type="button"
        aria-label="New Note"
      >
        ＋
      </button>

    </header>


    <!-- =========================
         Search
         ========================= -->

    <div class="search-wrap">

      <input
        id="searchInput"
        type="search"
        placeholder="Search"
        autocomplete="off"
      >

    </div>


    <!-- =========================
         Notes List
         ========================= -->

    <section
      id="notesList"
      class="notes-list"
    ></section>


    <!-- =========================
         Empty State
         ========================= -->

    <section
      id="emptyState"
      class="empty hidden"
    >

      <div class="empty-icon">
        ✎
      </div>


      <h2>
        No Notes
      </h2>


      <p>
        Create your first note.
      </p>


      <button
        id="emptyNewBtn"
        class="primary"
        type="button"
      >
        New Note
      </button>

    </section>

  </main>


  <!-- ==================================================
       Editor
       ================================================== -->

  <section
    id="editor"
    class="editor hidden"
  >

    <!-- =========================
         Editor Header
         ========================= -->

    <header class="editor-bar">

      <button
        id="backBtn"
        class="text-btn"
        type="button"
      >
        ‹ Back
      </button>


      <div class="editor-actions">

        <button
          id="dirBtn"
          class="small-btn"
          type="button"
        >
          Auto
        </button>


        <button
          id="doneBtn"
          class="text-btn strong"
          type="button"
        >
          Done
        </button>

      </div>

    </header>


    <!-- =========================
         Note Title
         ========================= -->

    <input
      id="titleInput"
      class="title-input"
      type="text"
      placeholder="Title"
      autocomplete="off"
    >


    <!-- =========================
         Note Body
         ========================= -->

    <textarea
      id="bodyInput"
      class="body-input"
      placeholder="Start writing..."
      spellcheck="true"
    ></textarea>


    <!-- =========================
         Editor Footer
         ========================= -->

    <footer class="editor-footer">

      <button
        id="deleteBtn"
        class="danger-btn"
        type="button"
      >
        Delete Note
      </button>


      <span id="savedLabel">
        Saved
      </span>

    </footer>

  </section>


  <!-- ==================================================
       JavaScript
       ================================================== -->

  <script src="app.js?v=5"></script>

</body>

</html>
