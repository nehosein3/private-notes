<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f2f2f7"
  >

  <title>Notes</title>

  <link
    rel="stylesheet"
    href="style.css?v=3"
  >

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>

  <main class="app">

    <!-- =========================================
         Header
         ========================================= -->

    <header class="topbar">

      <div>

        <h1>
          Notes
        </h1>

        <div
          id="countLabel"
          class="count-label"
        >
          0 Notes
        </div>

      </div>


      <button
        id="newBtn"
        class="icon-button"
        type="button"
        aria-label="New note"
      >
        +
      </button>

    </header>


    <!-- =========================================
         Search
         ========================================= -->

    <div class="search-wrapper">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search"
        autocomplete="off"
      >

    </div>


    <!-- =========================================
         Folders
         ========================================= -->

    <section class="folders-section">

      <div class="section-header">

        <h2>
          Folders
        </h2>

        <button
          id="newFolderBtn"
          class="small-button"
          type="button"
        >
          New Folder
        </button>

      </div>


      <div
        id="foldersList"
        class="folders-list"
      >

        <button
          id="allNotesFolder"
          class="folder-item active"
          type="button"
        >

          <span class="folder-icon">
            📁
          </span>

          <span>
            All Notes
          </span>

        </button>

      </div>

    </section>


    <!-- =========================================
         Notes List
         ========================================= -->

    <section
      id="notesList"
      class="notes-list"
    >
    </section>


    <!-- =========================================
         Empty State
         ========================================= -->

    <section
      id="emptyState"
      class="empty-state"
    >

      <div class="empty-icon">
        📝
      </div>

      <h2>
        No Notes
      </h2>

      <p>
        Start writing your first note.
      </p>

      <button
        id="emptyNewBtn"
        class="primary-button"
        type="button"
      >
        New Note
      </button>

    </section>

  </main>


  <!-- =========================================
       Editor
       ========================================= -->

  <section
    id="editor"
    class="editor hidden"
  >

    <header class="editor-header">

      <button
        id="backBtn"
        class="text-button"
        type="button"
      >
        Back
      </button>


      <div
        id="savedLabel"
        class="saved-label"
      >
        New Note
      </div>


      <button
        id="doneBtn"
        class="text-button strong"
        type="button"
      >
        Done
      </button>

    </header>


    <div class="editor-toolbar">

      <button
        id="dirBtn"
        class="toolbar-button"
        type="button"
      >
        Auto
      </button>


      <select
        id="folderSelect"
        class="folder-select"
      >

        <option value="">
          No Folder
        </option>

      </select>


      <button
        id="deleteBtn"
        class="toolbar-button delete-button"
        type="button"
      >
        Delete
      </button>

    </div>


    <div class="editor-content">

      <input
        id="titleInput"
        class="title-input"
        type="text"
        placeholder="Title"
        autocomplete="off"
      >


      <textarea
        id="bodyInput"
        class="body-input"
        placeholder="Start writing..."
        spellcheck="true"
      ></textarea>

    </div>

  </section>


  <script src="app.js?v=9"></script>

</body>

</html>
